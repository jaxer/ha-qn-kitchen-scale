[project]
name = "ha-qn-kitchen-scale"
version = "0.2.0"
description = "Home Assistant integration for QN-KS Bluetooth kitchen scales"
requires-python = ">=3.14"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
